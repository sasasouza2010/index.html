.num{color:#7f8778;font-size:12px;width:25px;text-align:center}.name{font-size:15px;font-weight:600}
.book:has(input:checked){opacity:.55}.book:has(input:checked) .name{text-decoration:line-through}

<script>
const KEY="biblia-checklist-v1";
function get(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function toggleBook(i,on){let a=get();if(on&&!a.includes(i))a.push(i);if(!on)a=a.filter(x=>x!==i);save(a);update()}
function update(){let a=get();document.querySelectorAll("input").forEach((c,i)=>c.checked=a.includes(i));document.getElementById("count").textContent=a.length+"/73";document.getElementById("percent").textContent=Math.round(a.length/73*100)+"%";document.getElementById("fill").style.width=(a.length/73*100)+"%"}
function markAll(){save([...Array(73).keys()]);update()}
function clearAll(){save([]);update()}
update();
</script></body></html>
